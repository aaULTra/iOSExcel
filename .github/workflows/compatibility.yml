name: Validate actual Excel startup compatibility
on:
  push:
    branches: [main]
    paths:
      - 'shim/**'
      - 'tools/nib_archive.py'
      - 'tools/appkit_contracts.m'
      - 'tools/shim_coverage.py'
      - 'tools/objc_startup.py'
      - 'tools/excel_retarget.py'
      - 'tools/loader_plan.py'
      - 'tools/build_facades.py'
      - 'tools/test_loader.py'
      - 'tools/test_compatibility.sh'
      - 'tools/test_screen.sh'
      - 'tools/test_view.sh'
      - 'tests/**'
      - '!tests/simulator_screen_app.m'
      - '!tests/simulator_view_contracts.*'
      - '.github/workflows/compatibility.yml'
  workflow_dispatch:
concurrency:
  group: startup-compatibility-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  startup:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test native startup code before acquiring vendor resources
        run: |
          set -euo pipefail
          mkdir -p reports
          bash tools/test_compatibility.sh 2>&1 | tee reports/synthetic-startup-contracts.txt
          cp build/compatibility/exports.txt reports/ios-exports.txt
          bash tools/test_screen.sh 2>&1 | tee reports/native-screen-contracts.txt
          cp build/screen/native-report.json reports/native-screen-contracts.json
          bash tools/test_view.sh 2>&1 | tee reports/native-view-contracts.txt
          cp build/view/native-report.json reports/native-view-contracts.json
          python3 tools/shim_coverage.py docs/evidence/dependencies-16.55.json.gz reports/ios-exports.txt reports/shim-coverage.json
      - name: Exercise actual dyld two-level binding using original native fixtures
        run: |
          set -euo pipefail
          python3 tools/test_loader.py 2>&1 | tee reports/native-loader-contract.txt
          cp build/loader-contract/report.json reports/native-loader-contract.json
      - name: Download official Excel 16.55 and verify identity
        run: |
          set -euo pipefail
          mkdir -p private reports
          curl --fail --silent --show-error --location --retry 2 --max-time 900 'https://officecdn.microsoft.com/pr/C1297A47-86C4-4C1F-97FA-950631F94777/MacAutoupdate/Microsoft_Excel_16.55.21111400_Updater.pkg' -o private/Excel.pkg
          echo '07b150dba0a31e08b87394d266b61db3030ce897d8415e0505c3b29150c35f39  private/Excel.pkg' | shasum -a 256 --check
          pkgutil --check-signature private/Excel.pkg > reports/package-signature.txt
          spctl --assess --type install --verbose=2 private/Excel.pkg
          python3 - <<'PY'
          from pathlib import Path
          if 'Developer ID Installer: Microsoft Corporation (UBF8T346G9)' not in Path('reports/package-signature.txt').read_text():
              raise SystemExit('Unexpected installer signer')
          PY
      - run: python3 tools/extract_pkg.py private/Excel.pkg private/extracted
      - name: Retarget actual 55-image startup closure without changing code or fixups
        run: python3 tools/loader_plan.py 'private/extracted/Microsoft Excel.app' --inventory docs/evidence/excel-16.55.json.gz --graph docs/evidence/dependencies-16.55.json.gz --report reports/loader-plan-16.55.json --output-binaries private/retargeted-images
      - name: Build and sign iOS forwarding dylibs for measured load requirements
        run: python3 tools/build_facades.py --plan reports/loader-plan-16.55.json --shim build/compatibility/libExcelShim.dylib --output private/facades --report reports/ios-facades.json
      - name: Inspect actual Excel startup method contracts without executing Office
        run: python3 tools/objc_startup.py 'private/extracted/Microsoft Excel.app/Contents/MacOS/Microsoft Excel' --class XLApplication --class XLAppDelegate --class XLDocumentController --output reports/objc-startup-16.55.json
      - name: Capture real AppKit ABI contracts for required classes
        run: |
          python3 - <<'PY2'
          import gzip,json
          from pathlib import Path
          graph=json.loads(gzip.decompress(Path('docs/evidence/dependencies-16.55.json.gz').read_bytes()))
          names=sorted(s[len('_OBJC_CLASS_$_'):] for s in graph['closure_appkit_symbols'] if s.startswith('_OBJC_CLASS_$_'))
          Path('private/appkit-classes.json').write_text(json.dumps(names))
          PY2
          xcrun --sdk macosx clang -isysroot "$(xcrun --sdk macosx --show-sdk-path)" -fobjc-arc -fmodules -Wall -Wextra -Werror tools/appkit_contracts.m -framework AppKit -o private/appkit-contracts
          private/appkit-contracts private/appkit-classes.json reports/appkit-contracts.json
      - name: Native decoder, startup contracts and iOS bridge compile
        run: |
          set -euo pipefail
          build/compatibility/native-nib-tests build/compatibility/Synthetic.app/Contents 'private/extracted/Microsoft Excel.app/Contents/Resources/Base.lproj/XLMainMenu.nib' 2>&1 | tee reports/startup-contracts.txt
          cp build/compatibility/exports.txt reports/ios-exports.txt
      - name: Upload reports only, never vendor resources or unfinished IPAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Excel-startup-compatibility-reports
          path: reports/
          retention-days: 7
