name: Capture actual SDK contracts for first loader failure
on:
  push:
    branches: [main]
    paths:
      - 'tools/capture_loader_contracts.py'
      - 'tools/audit_kerberos.py'
      - 'shim/ExcelKerberos.*'
      - 'tests/kerberos_contracts.m'
      - 'tools/application_services_values.m'
      - 'docs/evidence/real-loader-latest.json'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read actual Apple SDK declarations without executing Office
        run: python3 tools/capture_loader_contracts.py --result docs/evidence/real-loader-latest.json --graph docs/evidence/dependencies-16.55.json.gz --output reports/first-failure-contracts.json
      - name: Capture actual ABI type encodings and public error constants
        run: |
          xcrun --sdk macosx clang -target arm64-apple-macos11.0 -fobjc-arc -Wall -Wextra -Werror tools/application_services_values.m -framework Foundation -framework ApplicationServices -o /tmp/excelport-services-values
          /tmp/excelport-services-values reports/application-services-values.json
      - name: Audit public Kerberos and GSS interfaces and Simulator exports without invoking authentication
        run: python3 tools/audit_kerberos.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-failure-SDK-contracts
          path: reports/
          retention-days: 7
