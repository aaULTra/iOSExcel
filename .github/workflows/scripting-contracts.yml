name: Capture native ScriptingBridge class ABI
on:
  push:
    branches: [main]
    paths:
      - 'tools/capture_loader_contracts.py'
      - 'tools/scripting_bridge_values.m'
      - 'experiments/scripting/**'
      - 'docs/evidence/real-loader-latest.json'
      - '.github/workflows/scripting-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Capture current failure declarations from the actual public Mac SDK
        run: python3 tools/capture_loader_contracts.py --result docs/evidence/real-loader-latest.json --graph docs/evidence/dependencies-16.55.json.gz --output reports/first-failure-contracts.json
      - name: Read actual ScriptingBridge method encodings without sending events
        run: |
          xcrun --sdk macosx clang -target arm64-apple-macos11.0 -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations tools/scripting_bridge_values.m -framework Foundation -framework ScriptingBridge -o /tmp/excelport-scripting-values
          /tmp/excelport-scripting-values reports/scripting-bridge-values.json
      - name: Check measured hierarchy and five exact native method encodings for unavailable automation
        run: |
          xcrun --sdk macosx clang -target arm64-apple-macos11.0 -fobjc-arc -Wall -Wextra -Werror -Ishim -Iexperiments/scripting -DEXCELSHIM_SCRIPTING_CONTRACT=1 tools/scripting_bridge_values.m experiments/scripting/ExcelScriptingBridge.m shim/ExcelShim.m -framework Foundation -o /tmp/excelport-scripting-compat
          /tmp/excelport-scripting-compat reports/scripting-bridge-compatibility.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          native={c['name']:c for c in json.loads(Path('reports/scripting-bridge-values.json').read_text())['classes']}
          compat={c['name']:c for c in json.loads(Path('reports/scripting-bridge-compatibility.json').read_text())['classes']}
          checks={'SBObject':[(False,'init')], 'SBApplication':[(False,'init'),(True,'currentApplication'),(True,'applicationWithBundleIdentifier:'),(True,'applicationWithProcessIdentifier:')]}
          for name, methods in checks.items():
              assert native[name]['superclass']==compat[name]['superclass'],name
              original={(bool(m['class_method']),m['selector']):m['encoding'] for m in native[name]['methods']}
              actual={(bool(m['class_method']),m['selector']):m['encoding'] for m in compat[name]['methods']}
              for key in methods: assert original[key]==actual[key],(name,key,original.get(key),actual.get(key))
          Path('reports/scripting-contract-validation.json').write_text(json.dumps({'native_method_encodings_checked':5,'hierarchies_checked':2,'automation_unavailable':True,'no_targets_or_authentication_fabricated':True,'excel_executed':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripting-bridge-contracts
          path: reports/
          retention-days: 7
